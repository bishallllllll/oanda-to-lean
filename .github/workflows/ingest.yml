name: oanda-ingest
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      axis:
        description: 'Slice index 0/1/2 (blank = whole list, no loop)'
        required: false
        default: ''
      instruments:
        description: 'Space-separated override (blank = all)'
        required: false
        default: ''
      since:
        description: 'Backfill start override YYYY-MM-DD (blank = depth)'
        required: false
        default: ''
      budget:
        description: 'Run budget in minutes (default 40, for tests)'
        required: false
        default: '40'

permissions:
  contents: read
  actions: write

concurrency:
  group: oanda-ingest-${{ inputs.axis || 'sched' }}
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CH_HOST: ${{ secrets.CH_HOST }}
      CH_PORT: ${{ secrets.CH_PORT }}
      CH_USER: ${{ secrets.CH_USER }}
      CH_PASSWORD: ${{ secrets.CH_PASSWORD }}
      OANDA_TOKEN: ${{ secrets.OANDA_TOKEN }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-python@751276eafca55f10f252026015f43c488f2322ba
        with:
          python-version: '3.12'
      - name: Dependencies
        run: pip install -q -r puller/requirements.txt
      - name: Ingest M1
        id: ingest
        env:
          ARG_AXIS: ${{ inputs.axis }}
          ARG_INSTRUMENTS: ${{ inputs.instruments || '' }}
          ARG_SINCE: ${{ inputs.since || '' }}
          ARG_BUDGET: ${{ inputs.budget || '40' }}
        run: |
          EXTRA=""
          [ -n "$ARG_AXIS" ] && EXTRA="$EXTRA --axis $ARG_AXIS --axes ${{ vars.AXES }}"
          [ -n "$ARG_INSTRUMENTS" ] && EXTRA="$EXTRA --instruments $ARG_INSTRUMENTS"
          [ -n "$ARG_SINCE" ] && EXTRA="$EXTRA --since $ARG_SINCE"
          # `| tee` returns tee's status, so puller.py's was discarded -- the same defect
          # that was fixed in the materialize step. A silently dead M1 ingest freezes every
          # derived timeframe while the build stays green.
          set +e
          python3 puller/puller.py \
            --mode direct --max-minutes $ARG_BUDGET \
            --workers ${{ vars.WORKERS }} \
            --depth-years ${{ vars.DEPTH_YEARS }} \
            $EXTRA > /tmp/ingest.log 2>&1
          RC=$?
          set -e
          tail -20 /tmp/ingest.log
          if [ "$RC" -ne 0 ]; then
            echo "::error::puller.py exited $RC - candles_m1 may be stale"
          fi
          exit "$RC"
      - name: Materialize resolutions
        run: |
          EXTRA=""
          [ -n "${{ inputs.axis }}" ] && EXTRA="--axis ${{ inputs.axis }} --axes ${{ vars.AXES }}"
          [ -n "${{ inputs.instruments }}" ] && EXTRA="$EXTRA --instruments ${{ inputs.instruments }}"
          [ "${{ inputs.since }}" != "" ] && EXTRA="$EXTRA --full"
          # Write to a log file, print the tail, then exit with materialize.py's own status.
          # Previously this was `... | tail -8`, so the pipe returned tail's exit code and a
          # crashed materialisation reported success. That is how every higher timeframe
          # stayed frozen while the workflow stayed green.
          set +e
          python3 puller/materialize.py --mode direct --workers ${{ vars.WORKERS }} $EXTRA > /tmp/materialize.log 2>&1
          RC=$?
          set -e
          tail -20 /tmp/materialize.log
          if [ "$RC" -ne 0 ]; then
            echo "::error::materialize.py exited $RC - higher timeframes may be stale"
          fi
          exit "$RC"
      - name: Continue loop
        if: ${{ inputs.axis != '' && vars.LOOP_OFF == '' && always() && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q AXIS_DONE /tmp/ingest.log; then
            echo "AXIS_DONE -> slice complete, this axis stops looping"
            exit 0
          fi
          echo "not done -> dispatching next run for axis ${{ inputs.axis }}"
          gh workflow run ingest.yml -f axis="${{ inputs.axis }}" --repo "${{ github.repository }}"
